<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera + Admin Panel</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: sans-serif;
        background: #111;
        color: #fff;
        margin: 0;
        padding: 15px;
    }
    h2 { text-align: center; }
    .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }
    .tabs button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #333;
        color: #aaa;
        font-size: 15px;
    }
    .tabs button.active {
        background: #2563eb;
        color: #fff;
    }
    .view { display: none; text-align: center; }
    .view.active { display: block; }

    video, canvas, img.preview {
        width: 90%;
        max-width: 400px;
        border-radius: 12px;
        margin-top: 10px;
    }
    button.action {
        padding: 12px 22px;
        margin: 8px 5px;
        font-size: 15px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
    }
    button.danger { background: #dc2626; }
    #status { margin-top: 10px; font-size: 13px; color: #aaa; }

    .gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 15px;
    }
    .gallery-item {
        background: #1c1c1c;
        border-radius: 10px;
        padding: 8px;
    }
    .gallery-item img {
        width: 100%;
        border-radius: 8px;
    }
    .gallery-item .meta {
        font-size: 11px;
        color: #999;
        margin: 6px 0;
    }
    .gallery-item button {
        width: 100%;
        padding: 6px;
        border: none;
        border-radius: 6px;
        background: #dc2626;
        color: #fff;
        font-size: 12px;
    }
    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    .count { font-size: 13px; color: #aaa; }
</style>
</head>
<body>

<h2>Camera + Admin Panel</h2>

<div class="tabs">
    <button id="tabCamera" class="active">Camera</button>
    <button id="tabAdmin">Admin Panel</button>
</div>

<!-- CAMERA VIEW -->
<div id="viewCamera" class="view active">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="preview" class="preview" style="display:none;">

    <br>
    <button id="startBtn" class="action">Camera Chalu Karo</button>
    <button id="captureBtn" class="action" style="display:none;">Photo Lo</button>
    <button id="saveBtn" class="action" style="display:none;">Save Karo</button>
    <button id="retakeBtn" class="action" style="display:none;">Dobara Lo</button>

    <p id="status"></p>
</div>

<!-- ADMIN VIEW -->
<div id="viewAdmin" class="view">
    <div class="top-bar">
        <span class="count" id="photoCount">0 photos</span>
        <button id="deleteAllBtn" class="action danger">Sab Delete Karo</button>
    </div>
    <div class="gallery" id="gallery"></div>
</div>

<script>
// ---------- IndexedDB Setup ----------
const DB_NAME = "cameraAppDB";
const STORE_NAME = "photos";
let db;

const openReq = indexedDB.open(DB_NAME, 1);

openReq.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
    }
};

openReq.onsuccess = (e) => {
    db = e.target.result;
    loadGallery();
};

function savePhoto(dataUrl) {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).add({
        image: dataUrl,
        date: new Date().toLocaleString()
    });
}

function deletePhoto(id) {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = loadGallery;
}

function deleteAllPhotos() {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = loadGallery;
}

function loadGallery() {
    const gallery = document.getElementById('gallery');
    const countEl = document.getElementById('photoCount');
    gallery.innerHTML = "";

    const tx = db.transaction(STORE_NAME, "readonly");
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();

    req.onsuccess = () => {
        const items = req.result.reverse();
        countEl.textContent = items.length + " photos";

        items.forEach(item => {
            const div = document.createElement('div');
            div.className = "gallery-item";
            div.innerHTML = `
                <img src="${item.image}">
                <div class="meta">${item.date}</div>
                <button data-id="${item.id}">Delete</button>
            `;
            div.querySelector('button').addEventListener('click', () => deletePhoto(item.id));
            gallery.appendChild(div);
        });
    };
}

document.getElementById('deleteAllBtn').addEventListener('click', () => {
    if (confirm("Sab photos delete karni hain? Ye wapis nahi aayengi.")) {
        deleteAllPhotos();
    }
});

// ---------- Tabs ----------
const tabCamera = document.getElementById('tabCamera');
const tabAdmin = document.getElementById('tabAdmin');
const viewCamera = document.getElementById('viewCamera');
const viewAdmin = document.getElementById('viewAdmin');

tabCamera.addEventListener('click', () => {
    tabCamera.classList.add('active');
    tabAdmin.classList.remove('active');
    viewCamera.classList.add('active');
    viewAdmin.classList.remove('active');
});

tabAdmin.addEventListener('click', () => {
    tabAdmin.classList.add('active');
    tabCamera.classList.remove('active');
    viewAdmin.classList.add('active');
    viewCamera.classList.remove('active');
    loadGallery();
});

// ---------- Camera Logic ----------
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const preview = document.getElementById('preview');
const startBtn = document.getElementById('startBtn');
const captureBtn = document.getElementById('captureBtn');
const saveBtn = document.getElementById('saveBtn');
const retakeBtn = document.getElementById('retakeBtn');
const status = document.getElementById('status');

let stream = null;
let capturedDataUrl = null;

startBtn.addEventListener('click', async () => {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
        });
        video.srcObject = stream;
        video.style.display = "block";
        startBtn.style.display = "none";
        captureBtn.style.display = "inline-block";
        status.textContent = "Camera chalu hai";
    } catch (err) {
        status.textContent = "Permission nahi mili ya camera available nahi: " + err.message;
    }
});

captureBtn.addEventListener('click', () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    capturedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
    preview.src = capturedDataUrl;
    preview.style.display = "block";
    video.style.display = "none";

    captureBtn.style.display = "none";
    saveBtn.style.display = "inline-block";
    retakeBtn.style.display = "inline-block";
    status.textContent = "Photo li gayi — save karo ya dobara lo";
});

saveBtn.addEventListener('click', () => {
    savePhoto(capturedDataUrl);
    status.textContent = "Save ho gayi — Admin Panel mein dekh sakte ho";

    preview.style.display = "none";
    saveBtn.style.display = "none";
    retakeBtn.style.display = "none";
    video.style.display = "block";
    captureBtn.style.display = "inline-block";
});

retakeBtn.addEventListener('click', () => {
    preview.style.display = "none";
    saveBtn.style.display = "none";
    retakeBtn.style.display = "none";
    video.style.display = "block";
    captureBtn.style.display = "inline-block";
    status.textContent = "Dobara photo lo";
});
</script>

</body>
</html>
